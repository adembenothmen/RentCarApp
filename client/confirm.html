                        <a href="mailto:benothmenneadem@gmail.com" class="text-muted me-0"><i class="fas fa-envelope text-primary me-2"></i>benothmenneadem@gmail.com</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid nav-bar sticky-top px-0 px-lg-4 py-2 py-lg-0">
        <div class="container">
            <nav class="navbar navbar-expand-lg navbar-light">

                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <div class="navbar-nav mx-auto py-0">

                    <a href="dashboard.html" class="btn btn-outline-dark rounded-pill py-2 px-4 me-2">Dashboard</a>

                </div>

    <div class="container-fluid bg-breadcrumb mb-5">

            <h4 class="text-white display-4 mb-4 wow fadeInDown" data-wow-delay="0.1s">Booking Confirmed</h4>
            <ol class="breadcrumb d-flex justify-content-center mb-0 wow fadeInDown" data-wow-delay="0.3s">

    <div class="container-fluid py-5">
        <div class="container">

            <div id="confirmation-content" class="row g-5 justify-content-center"></div>
        </div>
    </div>

    <div class="container-fluid footer py-5 mt-5 wow fadeIn" data-wow-delay="0.2s">

            <div class="row g-5">

                        <a href="mailto:benothmenneadem@gmail.com"><i class="fas fa-envelope me-2"></i> benothmenneadem@gmail.com</a>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/site.js"></script>
    <script src="js/main.js"></script>


    <script>
        (async function () {
            const messageBox = document.getElementById('confirmation-message');
            const content = document.getElementById('confirmation-content');
            const response = await fetch('../server/booking_session.php');
            const data = await response.json();

            if (!data.success || !data.bookingData) {
                messageBox.innerHTML = CentalApp.renderAlert('warning', 'No recent booking was found.');
                content.innerHTML = '<div class="col-lg-8 text-center"><a href="home.html" class="btn btn-primary rounded-pill py-3 px-5">Return to Home</a></div>';
                return;
            }

            content.innerHTML = `
                <div class="col-lg-8">
                    ${CentalApp.renderConfirmationCard(data.bookingData)}
                    <div class="row mt-5 text-center wow fadeInUp" data-wow-delay="0.3s">
                        <div class="col-12">
                            <a href="home.html" class="btn btn-primary rounded-pill py-3 px-5 me-2"><i class="fas fa-home me-2"></i>Return to Home</a>
                            <a href="cars.html" class="btn btn-outline-primary rounded-pill py-3 px-5"><i class="fas fa-car me-2"></i>Rent Another Car</a>
                        </div>
                    </div>
                </div>`;
        })();
    </script>
